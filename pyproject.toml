[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "longrun-agent"
version = "0.1.0"
description = "CLI-only LongRun Agent MVP"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.24.0",
    "prompt_toolkit>=3.0.43",
    "rich>=13.7.0",
]

[project.scripts]
longrun = "longrun_agent.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["longrun_agent*"]
