[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "longrun-agent"
version = "0.1.0"
description = "CLI-only LongRun Agent MVP"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
longrun = "longrun_agent.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["longrun_agent*"]
